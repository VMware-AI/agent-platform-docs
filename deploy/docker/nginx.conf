# 智能体管理平台 · 使用手册 —— 容器内 nginx 配置
#
# 这个 server 块是给 Docker 镜像用的：webroot 固定 /usr/share/nginx/html，
# 监听端口固定 80（对外端口由 docker run -p 决定）。
#
# 与 deploy/nginx.conf 是两份独立的配置：
#   - deploy/nginx.conf           : 宿主机 nginx 部署，webroot 由 install.sh 写入
#   - deploy/docker/nginx.conf    : 容器内 nginx 配置，webroot 固定
#
# 不要把这两个文件互相复制：宿主机那份要管 listen/root 等可调参数，容器里
# 没必要做这种抽象 —— 全静态，端口 webroot 都钉死。

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # cleanUrls 已开启，try_files 三段缺一不可，否则除首页外全部 404
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 带哈希的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存，保证发布后立即可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 本地搜索索引 + 字体
    location ~* \.(json|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    error_page 404 /404.html;

    access_log /var/log/nginx/agent-platform-docs.access.log;
    error_log  /var/log/nginx/agent-platform-docs.error.log;
}
