# 智能体管理平台 · 文档站 nginx 配置示例
#
# 用法：
#   1) 在 CI 或本地执行 `npm ci && npm run build`
#   2) 把 docs/.vitepress/dist/ 的内容同步到 /var/www/agent-platform-docs
#   3) 把本文件放到 /etc/nginx/conf.d/agent-platform-docs.conf
#   4) nginx -t && systemctl reload nginx
#
# 关键点：VitePress 开启了 cleanUrls，链接不带 .html。
# 必须靠 try_files 依次尝试 $uri、$uri.html、$uri/index.html，
# 否则除首页外全部 404。

server {
    listen       80;
    listen       [::]:80;
    server_name  docs.example.com;

    # 有证书时打开这段，把 HTTP 全量跳到 HTTPS
    # return 301 https://$host$request_uri;

    root  /var/www/agent-platform-docs;
    index index.html;

    charset utf-8;

    # ---- cleanUrls 的核心 ----
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 带哈希的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存，保证发布后立即可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 本地搜索索引
    location ~* \.(json|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    error_page 404 /404.html;

    access_log /var/log/nginx/agent-platform-docs.access.log;
    error_log  /var/log/nginx/agent-platform-docs.error.log;
}

# ---------------------------------------------------------------------------
# HTTPS 版本（有证书时启用，并把上面的 server 块改成 301 跳转）
