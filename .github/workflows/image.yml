# 打 tag 时构建并推送 Docker 镜像。
#
#   git tag v0.0.2 && git push origin v0.0.2
#
# 镜像会推到 GitHub Container Registry（GHCR）：
#   ghcr.io/<org>/agent-platform-docs:<版本>    —— 内容来自本次构建
#   ghcr.io/<org>/agent-platform-docs:latest    —— 同上（每个 tag 都同步刷新 latest）
#
# 也可以手工触发（workflow_dispatch），只构建不推送。
#
# 镜像使用的 base 镜像（在 Dockerfile / Makefile 里声明）：
#   quay.io/vmware-ai/node:24-alpine   仅为构建期
#   quay.io/vmware-ai/nginx:1.31.2     运行时

name: Build & publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: agent-platform-docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"                  # v0.0.2 -> 0.0.2
          [ -z "$VERSION" ] && VERSION="dev"
          OWNER="${GITHUB_REPOSITORY%/*}"
          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}"         >> "$GITHUB_OUTPUT"   # 小写
          echo "tags=${OWNER,,}/${IMAGE_NAME}:${VERSION},${OWNER,,}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
