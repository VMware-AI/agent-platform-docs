# 打 tag 时出离线发布包，并挂到 GitHub Release 上。
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# 也可以在 Actions 里手工触发（workflow_dispatch），只产出制品、不建 release。

name: Release offline bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Package
        run: ./deploy/package.sh

      - name: List artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body: |
            **智能体管理平台 · 官方使用手册** —— 39 页在线手册的离线发布包。

            ## 离线部署到自己的 nginx

            下载下方的 `agent-platform-docs-<版本>.tar.gz`，在目标机上：

            ```bash
            tar -xzf agent-platform-docs-<版本>.tar.gz
            cd agent-platform-docs-<版本>
            sudo ./install.sh
            ```

            默认部署到 `/var/www/agent-platform-docs`，监听 **8080**，完成后浏览器打开 `http://<本机IP>:8080/`。

            **目标机只需要 nginx，不需要 node、不需要联网。** 全站含站内搜索均可离线使用，页面运行时不发起任何外部请求。

            常用参数：

            ```bash
            sudo ./install.sh --port=80                     # 换端口
            sudo ./install.sh --root=/data/www/docs         # 换站点目录
            sudo ./install.sh --server-name=docs.corp.lan   # 换域名
            ./install.sh --dry-run                          # 先看它要做什么，不改任何东西
            ```

            ## 本地启动（改文档 / 看效果）

            需要 Node.js ≥ 18：

            ```bash
            git clone https://github.com/VMware-AI/agent-platform-docs.git
            cd agent-platform-docs
            npm install
            npm run dev
            ```

            浏览器打开 **http://localhost:5173/**，改 markdown 会热更新。

            ## 校验

            ```bash
            sha256sum -c agent-platform-docs-<版本>.tar.gz.sha256
            ```

            详见包内 `README.md` 与仓库 README。
