# 可选：把文档站发布到 GitHub Pages。
#
# 启用前提：仓库 Settings ▸ Pages ▸ Source 选 "GitHub Actions"。
# 如果只部署到自建 nginx，可以删掉这个 workflow —— build.yml 已经产出
# docs-dist 制品，下载解包同步到 webroot 即可。
#
# 注意：Pages 若发布在 https://<org>.github.io/<repo>/ 子路径下，
# 需要把 docs/.vitepress/config.ts 里的 base 改成 '/<repo>/'。

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
